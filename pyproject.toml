[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osintkit"
version = "1.3.0"
description = "Kit de OSINT para terminal: DNS, web, IP, email, usuarios, teléfono, cripto, organizaciones, amenazas, búsqueda y archivos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "osintkit contributors" }]
keywords = ["osint", "recon", "security", "terminal", "cli", "tui"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
phone = ["phonenumbers>=8.13"]
dev = ["pytest>=8"]

[project.scripts]
osintkit = "osintkit.cli:main"
osintol = "osintkit.cli:main"

[project.urls]
Homepage = "https://github.com/HormanBYAS/osintkit"
Repository = "https://github.com/HormanBYAS/osintkit"
Issues = "https://github.com/HormanBYAS/osintkit/issues"

[tool.setuptools]
packages = ["osintkit", "osintkit.modules"]

[tool.setuptools.package-data]
osintkit = ["data/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
